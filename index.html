<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>North Bangal Coder AI</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#0f172a;
}
.chat{
max-width:450px;
height:100vh;
margin:auto;
display:flex;
flex-direction:column;
background:#fff;
}
.header{
background:#2563eb;
color:#fff;
padding:15px;
text-align:center;
font-size:22px;
font-weight:bold;
}
.messages{
flex:1;
overflow-y:auto;
padding:15px;
background:#f3f4f6;
}
.msg{
padding:10px 14px;
margin:8px 0;
border-radius:10px;
max-width:80%;
word-wrap:break-word;
}
.user{
background:#2563eb;
color:#fff;
margin-left:auto;
}
.bot{
background:#e5e7eb;
color:#000;
}
.input{
display:flex;
padding:10px;
border-top:1px solid #ddd;
}
.input input{
flex:1;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
outline:none;
}
.input button{
margin-left:8px;
padding:12px 20px;
background:#2563eb;
color:#fff;
border:none;
border-radius:8px;
cursor:pointer;
}
</style>
</head>
<body>

<div class="chat">

<div class="header">
North Bangal Coder AI
</div>

<div id="messages" class="messages"></div>

<div class="input">
<input id="message" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendMessage()">
<button onclick="sendMessage()">Send</button>
</div>

</div>

<script>

const messages=document.getElementById("messages");

function addMessage(text,type){
const div=document.createElement("div");
div.className="msg "+type;
div.textContent=text;
messages.appendChild(div);
messages.scrollTop=messages.scrollHeight;
}

async function sendMessage(){

const input=document.getElementById("message");

const text=input.value.trim();

if(!text)return;

addMessage(text,"user");

input.value="";

try{

const response=await fetch("/api/chat",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
message:text
})
});

const data=await response.json();

if(!response.ok){
throw new Error(data.error || "Request failed");
}

addMessage(data.text || "No response","bot");

}catch(err){

addMessage("Error: "+err.message,"bot");

}

}

</script>

</body>
</html>
